version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # typeorm 1 drops the sqlite3 driver the bot uses, so it needs a move to better-sqlite3 first.
      - dependency-name: typeorm
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Odd Node majors never become LTS, so the base image stays on even lines.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
